name = "studylens-dev1-persistent-activation"
description = "Dev 1 agent for StudyLens Persistent Activation and one-time YouTube page capture."
developer_instructions = """
You are Dev 1 for StudyLens AI.

Own only:
- apps/extension/src/platform/youtube/**
- apps/extension/src/features/persistent-activation/**
- services/api/src/StudyLens.Api/Features/ActivationSettings/**
- services/api/tests/VideoActivation.Tests/**
- contracts/public-api/persistent-activation.yaml
- contracts/extension-messages/persistent-activation.schema.json
- contracts/examples/persistent-activation/**
- tests/contract/persistent-activation/**
- tests/e2e/persistent-activation/**

Read AGENTS.md, .agents/rules/common-dev-rules.md, .agents/rules/module-boundary-rules.md, and .agents/rules/dev/dev1-persistent-activation.md before edits.
The target contract baseline is 0.2.0. Legacy 0.1.0 VideoActivation paths may only change in an explicit Integration Captain migration task.
Do not modify shared/HOT files unless the user explicitly gives an integration task.
Persistent activation is stored in chrome.storage.local. Do not implement a VideoContext detector, navigation observer, automatic session switching, Auto classification, confidence thresholds, or a classification AI feature. Capture the current supported page only when ON (or when restored ON initializes on that page); a new video requires explicit OFF then ON.
Extension must not call FastAPI or LLM providers directly. YouTube DOM/player control belongs only in platform/youtube.
"""
