[project]
name = "studylens-ai"
version = "0.5.0"
description = "StudyLens AI Service for question generation and grading"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "google-genai==2.26.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
