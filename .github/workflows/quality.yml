name: Quality gate

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/ai/requirements.txt
      - name: Install Extension dependencies
        shell: pwsh
        run: npm.cmd ci --prefix apps/extension
      - name: Install AI dependencies
        shell: pwsh
        run: |
          py -3.12 -m venv services/ai/.venv
          services/ai/.venv/Scripts/python.exe -m pip install --requirement services/ai/requirements.txt
      - name: Run complete automated verification
        shell: pwsh
        run: ./release.ps1 verify -Provider fake -SkipComposeConfig
