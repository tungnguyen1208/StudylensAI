openapi: 3.0.3
info:
  title: StudyLens Public API - Full-video Learning Package
  version: 0.5.0
  description: Extension-to-Backend contract for immediate sessions, full transcript ingestion, processing state and full-video quizzes.
paths:
  /api/sessions:
    post:
      operationId: startStudySession
      summary: Start or replay a session immediately for an enabled YouTube video
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StartStudySessionRequest' } } }
      responses:
        '200': { description: Session created or replayed, content: { application/json: { schema: { $ref: '#/components/schemas/SessionSnapshot' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/sessions/{sessionId}/transcript:
    put:
      operationId: submitFullTranscript
      summary: Submit the full normalized YouTube transcript once for this session
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SubmitTranscriptRequest' } } }
      responses:
        '200': { description: Transcript accepted and processing queued, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPackage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/sessions/{sessionId}/learning-package:
    get:
      operationId: getLearningPackage
      summary: Read persisted transcript and quiz processing state
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200': { description: Current learning package, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPackage' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /api/sessions/{sessionId}/retry:
    post:
      operationId: retryLearningPackageStep
      summary: Retry the failed transcript-generation or quiz-generation step
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RetryProcessingRequest' } } }
      responses:
        '200': { description: Processing step requeued, content: { application/json: { schema: { $ref: '#/components/schemas/LearningPackage' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/sessions/{sessionId}/complete:
    post:
      operationId: completeStudySession
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CompleteStudySessionRequest' } } }
      responses:
        '200': { description: Closed session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionSnapshot' } } } }
        '404': { $ref: '#/components/responses/Error' }
components:
  parameters:
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error:
      description: Contract-shaped error
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  schemas:
    QuestionType: { type: string, enum: [multipleChoice, shortAnswer] }
    Difficulty: { type: string, enum: [easy, medium, hard] }
    SessionStatus: { type: string, enum: [active, completed, closed, failed] }
    TranscriptProcessingStatus: { type: string, enum: [waiting, validating, generating, ready, unavailable, failed] }
    QuizProcessingStatus: { type: string, enum: [notStarted, queued, generating, ready, failed] }
    TranscriptSource: { type: string, enum: [youtubeCaption, geminiVideo] }
    ProcessingOperation: { type: string, enum: [transcriptGenerate, quizGenerate] }
    PreferenceSnapshot:
      type: object
      additionalProperties: false
      required: [questionType, difficulty]
      properties:
        questionType: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
    StartStudySessionRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, activationId, idempotencyKey, youtubeVideoId, videoTitle, preferences]
      properties:
        contractVersion: { type: string, const: 0.5.0 }
        activationId: { type: string, format: uuid }
        idempotencyKey: { type: string, minLength: 1 }
        youtubeVideoId: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
        videoTitle: { type: string, minLength: 1 }
        preferences: { $ref: '#/components/schemas/PreferenceSnapshot' }
    TranscriptCue:
      type: object
      additionalProperties: false
      required: [startMs, endMs, text]
      properties:
        startMs: { type: integer, format: int64, minimum: 0 }
        endMs: { type: integer, format: int64, minimum: 1 }
        text: { type: string, minLength: 1 }
    SubmitTranscriptRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, idempotencyKey, youtubeVideoId, language, source, status, cues]
      properties:
        contractVersion: { type: string, const: 0.5.0 }
        idempotencyKey: { type: string, minLength: 1 }
        youtubeVideoId: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
        language: { type: string, minLength: 2 }
        source: { type: string, const: youtubeCaption }
        status: { type: string, enum: [available, unavailable, insufficient] }
        contentHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        durationMs: { type: integer, format: int64, minimum: 0 }
        cues: { type: array, items: { $ref: '#/components/schemas/TranscriptCue' } }
    RetryProcessingRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, operation]
      properties:
        contractVersion: { type: string, const: 0.5.0 }
        operation: { $ref: '#/components/schemas/ProcessingOperation' }
    CompleteStudySessionRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, clientCompletionId, reason]
      properties:
        contractVersion: { type: string, const: 0.5.0 }
        clientCompletionId: { type: string, format: uuid }
        reason: { type: string, enum: [activationDisabled, videoEnded, videoContextChanged, unsupportedWatchPage] }
    SessionSnapshot:
      type: object
      additionalProperties: false
      required: [sessionId, youtubeVideoId, videoTitle, status, preferences, startedAtUtc]
      properties:
        sessionId: { type: string, format: uuid }
        youtubeVideoId: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
        videoTitle: { type: string }
        status: { $ref: '#/components/schemas/SessionStatus' }
        preferences: { $ref: '#/components/schemas/PreferenceSnapshot' }
        startedAtUtc: { type: string, format: date-time }
        completedAtUtc: { type: string, format: date-time }
    TranscriptView:
      type: object
      additionalProperties: false
      required: [status, cueCount, cues]
      properties:
        status: { $ref: '#/components/schemas/TranscriptProcessingStatus' }
        transcriptCaptureId: { type: string, format: uuid }
        source: { $ref: '#/components/schemas/TranscriptSource' }
        language: { type: string }
        contentHash: { type: string }
        cueCount: { type: integer, minimum: 0 }
        cues: { type: array, items: { $ref: '#/components/schemas/TranscriptCue' } }
    QuestionSourceRef:
      type: object
      additionalProperties: false
      required: [youtubeVideoId, startMs, endMs]
      properties:
        youtubeVideoId: { type: string }
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 1 }
    QuestionOptionPublic:
      type: object
      additionalProperties: false
      required: [optionId, text]
      properties:
        optionId: { type: string }
        text: { type: string }
    QuestionPublic:
      type: object
      additionalProperties: false
      required: [questionId, type, prompt, source]
      properties:
        questionId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/QuestionType' }
        prompt: { type: string }
        options: { type: array, items: { $ref: '#/components/schemas/QuestionOptionPublic' } }
        source: { $ref: '#/components/schemas/QuestionSourceRef' }
    QuizPublic:
      type: object
      additionalProperties: false
      required: [quizId, sessionId, status, questions, createdAtUtc]
      properties:
        quizId: { type: string, format: uuid }
        sessionId: { type: string, format: uuid }
        status: { type: string, const: ready }
        questions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/QuestionPublic' } }
        createdAtUtc: { type: string, format: date-time }
    ProcessingError:
      type: object
      additionalProperties: false
      required: [operation, code, message, retryable]
      properties:
        operation: { $ref: '#/components/schemas/ProcessingOperation' }
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
    LearningPackage:
      type: object
      additionalProperties: false
      required: [session, transcript, quizStatus]
      properties:
        session: { $ref: '#/components/schemas/SessionSnapshot' }
        transcript: { $ref: '#/components/schemas/TranscriptView' }
        quizStatus: { $ref: '#/components/schemas/QuizProcessingStatus' }
        quiz: { $ref: '#/components/schemas/QuizPublic' }
        error: { $ref: '#/components/schemas/ProcessingError' }
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, status, message, traceId, retryable]
      properties:
        code: { type: string }
        status: { type: integer }
        message: { type: string }
        traceId: { type: string }
        retryable: { type: boolean }
