openapi: 3.0.3
info:
  title: StudyLens Public API — Video Activation Module
  version: 0.3.0
  description: Public Extension-to-Backend contracts owned by Dev 1.
paths:
  /api/video-activation/transcript-captures:
    post:
      operationId: createTranscriptCapture
      summary: Start an append-only transcript timeline for learner-approved tab audio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTranscriptCaptureRequest'
      responses:
        '200':
          description: Capture created or idempotently replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptCaptureRef' }
        '400': { description: Invalid request }
        '409': { description: Idempotency conflict }
  /api/video-activation/transcript-captures/{captureId}/audio-chunks:
    post:
      operationId: appendTranscriptAudioChunk
      summary: Transcribe one transient WebM/Opus tab-audio chunk and append its cues
      parameters:
        - name: captureId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadTranscriptAudioChunkRequest'
      responses:
        '200':
          description: Chunk accepted and transcript timeline updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptCaptureProgress' }
        '400': { description: Invalid audio metadata }
        '404': { description: Capture was not found }
        '409': { description: Idempotency conflict }
        '502': { description: Retryable STT provider failure }
  /api/video-activation/transcript-captures/{captureId}:
    get:
      operationId: getTranscriptCaptureDetails
      summary: Read the persisted cue timeline for the Side Panel transcript preview
      parameters:
        - name: captureId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Capture metadata and normalized transcript cues; raw audio is never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptCaptureDetails' }
        '404': { description: Capture was not found }
  /api/video-activation/transcript-snapshots:
    post:
      operationId: createTranscriptSnapshot
      summary: Create or replay an idempotent transcript snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTranscriptSnapshotRequest'
      responses:
        '200':
          description: Snapshot created or an identical idempotent request replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptSnapshotRef'
        '400':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: The idempotency key was reused with a different payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  schemas:
    TranscriptSnapshotStatus:
      type: string
      enum: [available, unavailable, insufficient]
    TranscriptSource:
      type: string
      enum: [youtubeCaption, tabAudioStt]
    CreateTranscriptCaptureRequest:
      type: object
      additionalProperties: false
      required: [idempotencyKey, youtubeVideoId]
      properties:
        idempotencyKey: { type: string, minLength: 1 }
        youtubeVideoId: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
        languageHint: { type: string, minLength: 2 }
    UploadTranscriptAudioChunkRequest:
      type: object
      required: [idempotencyKey, chunkIndex, startMs, endMs, mimeType, audio]
      properties:
        idempotencyKey: { type: string, minLength: 1 }
        chunkIndex: { type: integer, minimum: 0 }
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 1 }
        mimeType: { type: string, enum: [audio/webm, audio/webm;codecs=opus] }
        audio: { type: string, format: binary }
    TranscriptCaptureRef:
      type: object
      additionalProperties: false
      required: [transcriptCaptureId, youtubeVideoId, language, source, status, availableCueCount, version]
      properties:
        transcriptCaptureId: { type: string, format: uuid }
        youtubeVideoId: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
        language: { type: string, minLength: 2 }
        source: { $ref: '#/components/schemas/TranscriptSource' }
        status: { type: string, enum: [pending, available, insufficient] }
        availableCueCount: { type: integer, minimum: 0 }
        version: { type: integer, minimum: 0 }
    TranscriptCaptureProgress:
      type: object
      additionalProperties: false
      required: [capture, cueCount, acceptedChunkIndex]
      properties:
        capture: { $ref: '#/components/schemas/TranscriptCaptureRef' }
        cueCount: { type: integer, minimum: 0 }
        acceptedChunkIndex: { type: integer, minimum: 0 }
    TranscriptCaptureDetails:
      type: object
      additionalProperties: false
      required: [capture, cues]
      properties:
        capture: { $ref: '#/components/schemas/TranscriptCaptureRef' }
        cues:
          type: array
          items: { $ref: '#/components/schemas/TranscriptCue' }
    TranscriptCue:
      type: object
      additionalProperties: false
      required: [startMs, endMs, text]
      properties:
        startMs:
          type: integer
          format: int64
          minimum: 0
        endMs:
          type: integer
          format: int64
          minimum: 1
        text:
          type: string
          minLength: 1
    CreateTranscriptSnapshotRequest:
      type: object
      additionalProperties: false
      required:
        - idempotencyKey
        - youtubeVideoId
        - language
        - source
        - status
        - cues
      properties:
        idempotencyKey:
          type: string
          minLength: 1
        youtubeVideoId:
          type: string
          pattern: '^[A-Za-z0-9_-]{11}$'
        language:
          type: string
          minLength: 2
        source:
          $ref: '#/components/schemas/TranscriptSource'
        status:
          $ref: '#/components/schemas/TranscriptSnapshotStatus'
        contentHash:
          type: string
          pattern: '^[a-f0-9]{64}$'
        cues:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptCue'
    TranscriptSnapshotRef:
      type: object
      additionalProperties: false
      required:
        - transcriptSnapshotId
        - youtubeVideoId
        - language
        - status
        - version
      properties:
        transcriptSnapshotId:
          type: string
          format: uuid
        youtubeVideoId:
          type: string
        language:
          type: string
        status:
          $ref: '#/components/schemas/TranscriptSnapshotStatus'
        contentHash:
          type: string
          nullable: true
        version:
          type: string
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, status, message, traceId, retryable]
      properties:
        code:
          type: string
        status:
          type: integer
        message:
          type: string
        traceId:
          type: string
        retryable:
          type: boolean
