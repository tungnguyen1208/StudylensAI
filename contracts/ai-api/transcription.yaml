openapi: 3.0.3
info:
  title: StudyLens AI Service - Tab Audio Transcription
  version: 0.3.0
  description: Internal Backend-to-FastAPI contract. Audio is transient and must not be persisted.
paths:
  /api/transcriptions:
    post:
      operationId: transcribeTabAudioChunk
      summary: Transcribe one WebM/Opus YouTube tab-audio chunk into absolute timeline cues.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, startMs, endMs]
              properties:
                audio: { type: string, format: binary, description: Transient WebM/Opus audio only. }
                startMs: { type: integer, minimum: 0 }
                endMs: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Validated absolute timeline cues.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscriptionResponse' }
        '422': { description: Invalid chunk metadata or MIME type }
        '502': { description: Retryable STT provider failure or invalid provider response }
components:
  schemas:
    TranscriptionCue:
      type: object
      additionalProperties: false
      required: [startMs, endMs, text]
      properties:
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 1 }
        text: { type: string, minLength: 1 }
    TranscriptionResponse:
      type: object
      additionalProperties: false
      required: [language, cues]
      properties:
        language: { type: string, minLength: 2, maxLength: 16 }
        cues:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TranscriptionCue' }
