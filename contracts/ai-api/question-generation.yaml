openapi: 3.0.3
info:
  title: StudyLens AI API - Question Generation
  version: 0.1.0
  description: Backend-to-FastAPI only. Never called by the Extension.
paths:
  /api/ai/question-generation/generate:
    post:
      operationId: generateQuestions
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuestionGenerationRequest' } } }
      responses:
        '200': { description: Valid internal questions, content: { application/json: { schema: { $ref: '#/components/schemas/QuestionGenerationResponse' } } } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422': { $ref: '#/components/responses/InvalidOutputError' }
        '503': { $ref: '#/components/responses/ProviderUnavailableError' }
components:
  responses:
    ValidationError: { description: Segment input is invalid or insufficient, content: { application/json: { schema: { $ref: '#/components/schemas/AiErrorEnvelope' } } } }
    InvalidOutputError: { description: LLM output fails validation, content: { application/json: { schema: { $ref: '#/components/schemas/AiErrorEnvelope' } } } }
    ProviderUnavailableError: { description: Retryable provider failure, content: { application/json: { schema: { $ref: '#/components/schemas/AiErrorEnvelope' } } } }
  schemas:
    QuestionType: { type: string, enum: [multipleChoice, shortAnswer] }
    Difficulty: { type: string, enum: [easy, medium, hard] }
    TranscriptCue:
      type: object
      additionalProperties: false
      required: [startMs, endMs, text]
      properties:
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 1 }
        text: { type: string, minLength: 1 }
    QuestionGenerationRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, promptVersion, segmentId, youtubeVideoId, startMs, endMs, questionType, difficulty, cues]
      properties:
        contractVersion: { type: string, const: 0.1.0 }
        promptVersion: { type: string, const: 0.1.0 }
        segmentId: { type: string, format: uuid }
        youtubeVideoId: { type: string, pattern: '^[A-Za-z0-9_-]{11}$' }
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 1 }
        questionType: { $ref: '#/components/schemas/QuestionType' }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        cues: { type: array, minItems: 1, items: { $ref: '#/components/schemas/TranscriptCue' } }
    GeneratedOption:
      type: object
      additionalProperties: false
      required: [optionId, text]
      properties: { optionId: { type: string, minLength: 1 }, text: { type: string, minLength: 1 } }
    GeneratedQuestion:
      type: object
      additionalProperties: false
      required: [type, prompt, sourceStartMs, sourceEndMs]
      properties:
        type: { $ref: '#/components/schemas/QuestionType' }
        prompt: { type: string, minLength: 1 }
        options: { type: array, minItems: 2, items: { $ref: '#/components/schemas/GeneratedOption' } }
        correctOptionId: { type: string, minLength: 1 }
        referenceAnswer: { type: string, minLength: 1 }
        sourceStartMs: { type: integer, minimum: 0 }
        sourceEndMs: { type: integer, minimum: 1 }
    QuestionGenerationResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, promptVersion, questions]
      properties:
        contractVersion: { type: string, const: 0.1.0 }
        promptVersion: { type: string, const: 0.1.0 }
        questions: { type: array, minItems: 1, items: { $ref: '#/components/schemas/GeneratedQuestion' } }
    AiErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties: { code: { type: string }, message: { type: string }, retryable: { type: boolean } }
