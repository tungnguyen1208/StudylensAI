openapi: 3.0.3
info:
  title: StudyLens AI Service - Short-answer Grading
  version: 0.5.0
paths:
  /api/ai/grading/short-answer:
    post:
      operationId: gradeShortAnswer
      summary: Grade a short answer through the configured server-side provider; fake remains available for tests.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShortAnswerGradeRequest' } } }
      responses:
        '200': { description: Validated grading result, content: { application/json: { schema: { $ref: '#/components/schemas/ShortAnswerGradeResponse' } } } }
        '400': { description: Invalid grading request, content: { application/json: { schema: { $ref: '#/components/schemas/AiErrorEnvelope' } } } }
        '422': { description: Provider returned an invalid structured grade, content: { application/json: { schema: { $ref: '#/components/schemas/AiErrorEnvelope' } } } }
        '503': { description: Provider is unavailable, timed out, or rate limited, content: { application/json: { schema: { $ref: '#/components/schemas/AiErrorEnvelope' } } } }
components:
  schemas:
    ShortAnswerGradeRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, questionId, prompt, referenceAnswer, answerText]
      properties:
        contractVersion: { const: '0.5.0' }
        questionId: { type: string, format: uuid }
        prompt: { type: string, minLength: 1 }
        referenceAnswer: { type: string, minLength: 1 }
        answerText: { type: string, minLength: 1 }
    ShortAnswerGradeResponse:
      type: object
      additionalProperties: false
      required: [outcome, score, referenceAnswer, explanation]
      properties:
        outcome: { type: string, enum: [correct, incorrect, partiallyCorrect] }
        score: { type: number, minimum: 0, maximum: 1 }
        referenceAnswer: { type: string, minLength: 1 }
        explanation: { type: string, minLength: 1 }
    AiErrorEnvelope:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: { type: string, minLength: 1 }
        message: { type: string, minLength: 1 }
        retryable: { type: boolean }
