openapi: 3.0.3
info:
  title: StudyLens AI Service - Deterministic Grading
  version: 0.3.0
paths:
  /api/ai/grading/short-answer:
    post:
      operationId: gradeShortAnswer
      summary: Deterministically grade a short answer for local development without an LLM.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShortAnswerGradeRequest' } } }
      responses:
        '200': { description: Validated grading result, content: { application/json: { schema: { $ref: '#/components/schemas/ShortAnswerGradeResponse' } } } }
        '422': { description: Invalid request }
components:
  schemas:
    ShortAnswerGradeRequest:
      type: object
      additionalProperties: false
      required: [contractVersion, questionId, prompt, referenceAnswer, answerText]
      properties:
        contractVersion: { const: '0.3.0' }
        questionId: { type: string, format: uuid }
        prompt: { type: string, minLength: 1 }
        referenceAnswer: { type: string, minLength: 1 }
        answerText: { type: string, minLength: 1 }
    ShortAnswerGradeResponse:
      type: object
      additionalProperties: false
      required: [outcome, score, referenceAnswer, explanation]
      properties:
        outcome: { type: string, enum: [correct, incorrect, partiallyCorrect] }
        score: { type: number, minimum: 0, maximum: 1 }
        referenceAnswer: { type: string, minLength: 1 }
        explanation: { type: string, minLength: 1 }
